<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 2</title>
    <script src="https://d3js.org/d3.v7.min.js"></script> <!-- Load D3 library -->
    <link rel="stylesheet" href="style.css"> <!-- Connect to style.css for styles -->
</head>
<body class="vertical-container">
    <!-- HEADER -->
    <div class="item">
        <h1>Storms vs People: The ongoing race of climate change and human preparedness</h1>
        <p><strong>Author(s):</strong> Brooks Scheibler</p>
        <p><strong>Documentation:</strong><a href="https://docs.google.com/document/d/11NGxHIz_bS4pam2AmaK06ffzbXIe0wiPAIS3KzweQhk/edit?usp=sharing" target="_blank">Google Doc Here!</a></p>
    </div>
    
    <!-- INTERACTIVE WIDGETS -->
    <div class="item horizontal-container">
        <div class="item"><!-- Your widget 1 code goes here. -->
           <h3>Storm Casualty Values</h3>
           <div id="avgSelector">
                <label><input type="checkbox" value="avgDeathsPerStorm" checked> Avg Deaths</label>
                <label><input type="checkbox" value="avgInjuredPerStorm"> Avg Injured</label>
                <label><input type="checkbox" value="avgHomelessPerStorm"> Avg Homeless</label>
            </div> 
        </div>


        <div class="item">
            <h3>Show Trendlines</h3>
            <label><input type="checkbox" id="trendline-toggle"></label>
            <p>Note: Trendlines only appear on line chart</p>
        </div>
        <div class="item">
            <h3>Change Chart Type </h3>
            <select id="chartType">
                <option value="line">Line Chart</option>
                <option value="stackedBar">Stacked Bar Chart</option>
            </select>
        </div>
    </div>

    <!-- CHART(S) -->
    <div class="item chart-container">
        <h2>Average Tropical Storm Casualties in the Philippines</h2>
        <svg id="lineChart1" width="900" height="400"></svg> <!-- If you change this ID name, you must change it in main.js too -->
        <div id="legendContainer" style="margin-top: 10px;"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
